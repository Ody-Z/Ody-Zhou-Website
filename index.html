<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ody Zhou — Software Engineer & AI Researcher</title>
    <meta name="description" content="Personal portfolio of Ody Zhou — Software Engineer & AI Researcher building intelligent systems." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cream': '#EDE8DC',
              'cream-2': '#E4DFD2',
              'cream-3': '#D6D1C5',
              'navy': '#1A1A1A',
              'navy-2': '#2C2C2C',
              'yellow': '#FFDD00',
              'sky': '#7DC7E8',
              'sky-light': '#A8D8F0',
              'orange': '#F4763B',
              'teal': '#30C9B8',
              'red-shape': '#E63946',
              'green-shape': '#52B788',
              'blue-shape': '#4A90D9',
              'purple-shape': '#9B72CF',
            },
            fontFamily: {
              'mono': ['"Space Mono"', '"Courier New"', 'monospace'],
              'display': ['Syne', 'sans-serif'],
              'body': ['"DM Sans"', 'system-ui', 'sans-serif'],
            },
            animation: {
              'marquee': 'marquee 28s linear infinite',
              'float':   'shapeFloat 6s ease-in-out infinite',
              'float-2': 'shapeFloat 8s ease-in-out 1.5s infinite',
              'float-3': 'shapeFloat 7s ease-in-out 3s infinite',
              'spin-slow': 'spin 18s linear infinite',
              'wiggle': 'wiggle 3s ease-in-out infinite',
            },
            keyframes: {
              marquee: {
                '0%':   { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              shapeFloat: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '50%':      { transform: 'translateY(-14px) rotate(8deg)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-4deg)' },
                '50%':      { transform: 'rotate(4deg)' },
              },
            },
          },
        },
      }
    </script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 104px;
      }

      body {
        background-color: #EDE8DC;
        color: #1A1A1A;
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      ::selection { background-color: #FFDD00; color: #1A1A1A; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #EDE8DC; }
      ::-webkit-scrollbar-thumb { background: #1A1A1A; }
      ::-webkit-scrollbar-thumb:hover { background: #F4763B; }

      /* ── Scroll reveal ── */
      .reveal {
        opacity: 0;
        transform: translateY(32px);
        transition: opacity 0.65s ease-out, transform 0.65s ease-out;
      }
      .reveal.visible { opacity: 1; transform: translateY(0); }
      .reveal-delay-1 { transition-delay: 0.1s; }
      .reveal-delay-2 { transition-delay: 0.2s; }
      .reveal-delay-3 { transition-delay: 0.3s; }
      .reveal-delay-4 { transition-delay: 0.4s; }

      /* ── Marquee ── */
      .marquee-wrap { overflow: hidden; }
      .marquee-track {
        display: flex;
        width: max-content;
        animation: marquee 28s linear infinite;
      }

      /* ── Buttons ── */
      .btn-primary {
        background: #FFDD00;
        border: 2.5px solid #1A1A1A;
        color: #1A1A1A;
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 14px 28px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn-primary:hover {
        background: #1A1A1A;
        color: #FFDD00;
        transform: translate(-3px, -3px);
        box-shadow: 5px 5px 0 #FFDD00;
      }

      .btn-outline {
        background: transparent;
        border: 2.5px solid #1A1A1A;
        color: #1A1A1A;
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 14px 28px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn-outline:hover {
        background: #1A1A1A;
        color: #EDE8DC;
        transform: translate(-3px, -3px);
        box-shadow: 5px 5px 0 rgba(0,0,0,0.4);
      }

      .btn-small {
        background: transparent;
        border: 2.5px solid #1A1A1A;
        color: #1A1A1A;
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 20px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn-small:hover {
        background: #1A1A1A;
        color: white;
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
      }

      /* ── Cards ── */
      .exp-card {
        border: 2.5px solid #1A1A1A;
        background: #EDE8DC;
        position: relative;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .exp-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 6px 6px 0 #1A1A1A;
      }

      .skill-card {
        background: white;
        border: 2.5px solid #1A1A1A;
        position: relative;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .skill-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
      }

      /* ── Tech tags ── */
      .tech-tag {
        border: 1.5px solid #1A1A1A;
        font-family: 'Space Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 9px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: white;
        color: #1A1A1A;
        display: inline-block;
      }

      /* ── Speech bubble ── */
      .speech-bubble {
        position: relative;
        background: white;
        border: 2.5px solid #1A1A1A;
        padding: 10px 18px;
        display: inline-block;
      }
      .speech-bubble--down::after {
        content: '';
        position: absolute;
        bottom: -14px; left: 18px;
        width: 0; height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 14px solid #1A1A1A;
      }
      .speech-bubble--down::before {
        content: '';
        position: absolute;
        bottom: -10px; left: 20px;
        width: 0; height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 11px solid white;
        z-index: 1;
      }

      /* ── Terminal ── */
      .terminal {
        background: #1E1E2E;
        border: 2.5px solid #1A1A1A;
        font-family: 'Space Mono', monospace;
        font-size: 12.5px;
        line-height: 1.85;
        overflow: hidden;
      }
      .terminal-bar {
        background: #2A2A3E;
        padding: 10px 16px;
        border-bottom: 2px solid #1A1A1A;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      /* ── Clouds ── */
      @keyframes cloudDrift1 { 0%,100% { transform: translateX(0);   } 50% { transform: translateX(12px);  } }
      @keyframes cloudDrift2 { 0%,100% { transform: translateX(0);   } 50% { transform: translateX(-10px); } }
      @keyframes cloudDrift3 { 0%,100% { transform: translateX(0);   } 50% { transform: translateX(8px);   } }
      .cloud-1 { animation: cloudDrift1  9s ease-in-out infinite; }
      .cloud-2 { animation: cloudDrift2 11s ease-in-out   1s infinite; }
      .cloud-3 { animation: cloudDrift3 13s ease-in-out   2s infinite; }
      .cloud-4 { animation: cloudDrift1 10s ease-in-out   3s infinite; }

      /* ── Hero entry animations ── */
      @keyframes heroFadeUp {
        from { opacity: 0; transform: translateY(40px); }
        to   { opacity: 1; transform: translateY(0);    }
      }
      .hero-1 { animation: heroFadeUp 0.7s ease-out 0.10s both; }
      .hero-2 { animation: heroFadeUp 0.7s ease-out 0.25s both; }
      .hero-3 { animation: heroFadeUp 0.7s ease-out 0.40s both; }
      .hero-4 { animation: heroFadeUp 0.7s ease-out 0.55s both; }
      .hero-duck { animation: heroFadeUp 0.9s ease-out 0.70s both; }

      /* ── Noise overlay ── */
      body::after {
        content: '';
        position: fixed; inset: 0;
        pointer-events: none;
        opacity: 0.022;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* ── Nav link ── */
      .nav-link {
        position: relative;
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #1A1A1A;
        text-decoration: none;
        transition: color 0.15s ease;
        padding-bottom: 3px;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0;
        width: 0; height: 2px;
        background: #F4763B;
        transition: width 0.2s ease;
      }
      .nav-link:hover { color: #F4763B; }
      .nav-link:hover::after { width: 100%; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
